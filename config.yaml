# --- News / RSS -------------------------------------------------------------
# Categories are checked in this order: legal > ma_buyout > stock_split > product > other.
news_lookback_days: 7
legal_keywords: ["lawsuit", "sues", "sued", "sec investigation", "sec charges", "charged with", "indicted", "class action", "subpoena", "fraud", "settlement", "fine", "probe", "antitrust", "recall"]
ma_buyout_keywords: ["acquire", "acquisition", "buyout", "takeover", "merger", "tender offer", "to be acquired", "all-cash deal", "go private"]
stock_split_keywords: ["stock split", "forward split", "reverse split", "share split"]
product_keywords: ["launch", "unveil", "announce", "release", "new product", "ships", "debut", "reveal"]

# --- Market mood (overall market trend, shown in the dashboard and folded
# into every candidate's risk_score - see engine.scorer.market_mood_risk_component) --
market_mood:
  benchmark: "SPY"              # ticker used as the broad-market trend signal
  lookback_days: 5               # trading days to look back when computing % change
  bearish_threshold_pct: -1.5    # benchmark change <= this -> "bearish"
  bullish_threshold_pct: 1.5     # benchmark change >= this -> "bullish"; between the two -> "neutral"

# --- Live market pulse ------------------------------------------------------
# Lightweight ETF quotes shown on the dashboard and auto-refreshed by the
# browser (via /api/market-pulse) every `refresh_seconds` - a cheap,
# always-on proxy for overall market risk appetite. Independent of the
# recommendation pipeline below: this just hits each ticker's quick "quote"
# endpoint (no options chains, no SEC filings), and also opportunistically
# refreshes market_mood/market_news (still respecting their own TTLs above).
market_pulse:
  tickers: ["SPY", "IWM", "QQQ", "USO", "GLD", "TLT"]  # broad market / small-cap / tech / oil / gold / long bonds
  refresh_seconds: 30
  sparkline_period: "1d"      # how far back the little trend line next to each tile looks
  sparkline_interval: "15m"   # bar size for that lookback - a coarse shape, not a trading chart

# Query used to pull market-moving headlines (Fed decisions, macro data,
# geopolitical events) shown alongside the market mood indicator.
market_news_query: "stock market OR Federal Reserve OR Fed rate decision OR geopolitical"

# --- Sector performance ------------------------------------------------------
# % price change per GICS sector over the last `lookback_days`, via the
# SPDR Select Sector ETFs - the standard, cheap proxy for "how is tech/
# financials/energy doing" (one ticker per sector, not an average over
# every S&P 500 constituent). Shown on the dashboard ranked best-to-worst,
# and used to tag each candidate card with its own sector's recent trend.
sector_performance:
  lookback_days: 15
  tickers:
    XLK: "Information Technology"
    XLF: "Financials"
    XLV: "Health Care"
    XLY: "Consumer Discretionary"
    XLC: "Communication Services"
    XLI: "Industrials"
    XLP: "Consumer Staples"
    XLE: "Energy"
    XLU: "Utilities"
    XLRE: "Real Estate"
    XLB: "Materials"

# --- Caching / refresh cadence ----------------------------------------------
cache_ttl_minutes:
  options_chain: 20          # intraday - refresh often while market is open
  price: 15
  earnings_date: 1440          # once a day
  analyst_snapshot: 1440        # once a day - consensus rating / price target rarely moves intraday
  universe_list: 43200         # ~monthly
  sec_8k: 240                  # every 4 hours
  sec_13f: 10080                # weekly check (actual filings only land quarterly)
  news: 120                    # every 2 hours
  market_mood: 60               # hourly - benchmark trend doesn't need to be intraday-fresh
  market_news: 60               # hourly
  technicals: 240                # every 4 hours - the derived RSI/SMA/MACD computation; see price_history below for the raw pull it reads from
  price_history: 240              # every 4 hours - the shared daily-close cache every signal (technicals, drawdown, post-earnings windows,
                                   # outcome resolution, market mood, sector performance) reads from; daily-close-based, no need for intraday refresh
  sparkline: 10                   # every 10 min - the pulse tiles' trend line doesn't need to redraw every 30s tick
  universe_filter: 10080           # weekly - market cap/avg volume don't need to be fresher than that for this purpose
  sector_performance: 240          # every 4 hours - a 15-day trend doesn't shift meaningfully more often than that

# --- SEC EDGAR etiquette: SEC requires a descriptive User-Agent with contact info
sec_user_agent: "StockPutScreener/1.0 (contact: ankur.varsheny@gmail.com)"

# --- Optional auto-refresh while the local dashboard server (app.py) is running.
# Off by default - recommendations are generated on demand via the dashboard's
# "Generate recommendations" button (or `python run_pipeline.py`), since the
# full pipeline hits options chains/SEC filings for the whole universe and
# isn't something you want kicking off silently. Set enabled: true if you'd
# rather it refresh automatically each weekday morning. This only fires while
# `python app.py` / uvicorn is actively running on your machine - it is not a
# system-level scheduler. For a refresh that happens even when the server
# isn't running, use cron/launchd with run_pipeline.py directly (see README).
schedule:
  enabled: false
  hour: 9            # local time, see timezone below
  minute: 35          # 9:35am - a few minutes after the 9:30am US market open
  timezone: "America/New_York"
  days_of_week: "mon-fri"
